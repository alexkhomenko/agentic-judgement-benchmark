# TEST FIXTURE: frozen snapshot for the harness tests. Experiments use the project's own configs/.
# Evaluation policy for the fake vertical slice. Thresholds are drafts to settle during calibration
# (architecture.md, "Decisions to settle during calibration"); bump `revision` whenever anything changes.
policy_id: eval-default
revision: 2
rubric: rubrics/personal-workflows/rubric.yaml
packet_transformation:
  revision: 1
  # Narrow on purpose: candidates may legitimately name providers in technology choices, so broad
  # vendor-name masking would alter substance. Settle the real term list during calibration.
  identity_terms:
    - FakeArchitect
    - fake-architect-v1
    - fake-architect-v2
judges:
  - judge_id: judge-a
    configuration: configs/judges/fake/fake-judge-a.yaml
    prompt: configs/evaluation/prompts/judge-v1.md
  - judge_id: judge-b
    configuration: configs/judges/fake/fake-judge-b.yaml
    prompt: configs/evaluation/prompts/judge-v1.md
judge_max_attempts: 2
classifier:
  configuration: configs/judges/fake/fake-classifier.yaml
  prompt: configs/evaluation/prompts/classifier-v1.md
  rounds: [1, 4]
review_selection:
  fraction: 0.2
  seed: 1729
  extremes_per_round: 1
  disagreement:
    score_distance: 15
    dimension_distance: 2
adjudication:
  rule: human_precedence
acceptable:
  min_adjusted_score: 60
  status: draft
scoring_revision: 1
