# TEST FIXTURE: frozen snapshot for the harness tests. Experiments use the project's own configs/.
# LOCAL-001 (spec section 4.2): Qwen 3.5 9B, 4-bit MLX conversion, run directly by mlx-lm in the pinned worker
# environment (requirements-mlx-worker.txt). Open-weight model from Alibaba's Qwen team; provider is the model
# vendor, so self-preference maps to the catalog's alibaba vendor.
#
# Checkpoint: mlx-community/Qwen3.5-9B-4bit at commit 8b2b98c (2026-03-02), converted from Qwen/Qwen3.5-9B;
# affine 4-bit, group size 64. Weight and tokenizer hashes match the Hugging Face LFS sha256 (checked
# 2026-11-13). The snapshot includes vision weights; mlx-lm loads the text model only (benchmark is text-only).
# Different weights (affine 4-bit vs nvfp4), engine, and prompt renderer from configs/models/ollama/
# qwen3.5-9b-mlx.yaml, so results are not interchangeable with that configuration.
#
# native_recommended profile: the model card's "thinking mode for general tasks" sampling (Qwen/Qwen3.5-9B
# README at c202236, "Best Practices"). Neither repository ships a generation_config.json, and mlx-lm's own
# default is greedy decoding, so every recommended value is explicit. Discrepancy: mlx-lm applies
# presence_penalty to tokens in the last presence_context_size tokens (default 20, prompt included); the
# OpenAI-style penalty the card assumes covers all generated tokens.
configuration_id: local-qwen35-9b-4bit-mlx
revision: 1
track: local
adapter: mlx-lm
provider: alibaba
model: mlx-community/Qwen3.5-9B-4bit
profile: native_recommended
context_limit: 32768
parameters:
  max_output_tokens:
    state: explicit
    value: 16000
    source: same ceiling as the other candidates; includes thinking tokens and the stop token. Truncation is recorded, never retried.
  context_window:
    state: explicit
    value: 32768
    source: >-
      same window as the Ollama Qwen configurations; covers the qualification envelope (prompt + 2 x output budget +
      follow-up). Enforced before generation. The model card advises >= 128K to preserve thinking on hard tasks.
  enable_thinking:
    state: omitted
    documented_default: true
    source: chat template opens a <think> block unless enable_thinking is false; model card says thinking is the default
    verified_on: 2026-11-13
  temperature:
    state: explicit
    value: 1.0
    source: model card, thinking mode for general tasks
    verified_on: 2026-11-13
  top_p:
    state: explicit
    value: 0.95
    source: model card, thinking mode for general tasks
    verified_on: 2026-11-13
  top_k:
    state: explicit
    value: 20
    source: model card, thinking mode for general tasks
    verified_on: 2026-11-13
  min_p:
    state: explicit
    value: 0.0
    source: model card, thinking mode for general tasks
    verified_on: 2026-11-13
  presence_penalty:
    state: explicit
    value: 1.5
    source: model card, thinking mode for general tasks (mlx-lm window semantics, see header)
    verified_on: 2026-11-13
  presence_context_size:
    state: omitted
    documented_default: 20
    source: mlx-lm 0.32.2 make_logits_processors default; no model-card equivalent
  repetition_penalty:
    state: omitted
    documented_default: 1.0
    source: model card recommends 1.0 (no effect); mlx-lm applies none when omitted
  seed:
    state: omitted
    source: drawn per invocation by the worker and recorded in the native response
adapter_options:
  python: .venv-mlx/bin/python
  engine:
    python: 3.12.16
    mlx: 0.32.4
    mlx-metal: 0.32.4
    mlx-lm: 0.32.2
    transformers: 5.22.2
    tokenizers: 0.23.3
