# TEST FIXTURE: frozen snapshot for the harness tests. Experiments use the project's own configs/.
# Second Anthropic judge (different model, same provider family). The policy prefers judges from
# different families; replace with another provider's judge when one is available.
configuration_id: judge-anthropic-claude-sonnet-5-5
revision: 1
track: cloud
adapter: anthropic
provider: anthropic
model: claude-sonnet-5-5
profile: judge
context_limit: 1000000
parameters:
  max_output_tokens:
    state: explicit
    value: 16000
    source: judge output is a JSON assessment; non-streaming request ceiling
  effort:
    state: explicit
    value: high
    documented_default: high
    source: explicit so a provider default change cannot alter the judge
  thinking:
    state: omitted
    documented_default: {type: adaptive}
    source: provider default
  temperature:
    state: unsupported
    source: removed from the Messages API and not exposed by anthropic SDK 2.8.0
adapter_options:
  timeout_s: 600
  pricing:
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    cache_read_usd_per_mtok: 0.10
    source: claude-api reference model table cached 2026-11-03; verify against the first-party pricing page
    verified_on: null
