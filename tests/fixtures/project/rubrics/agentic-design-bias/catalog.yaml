# TEST FIXTURE: a small catalog of public products and model families for the harness tests. Not the
# benchmark's catalog. The tests rely on: claude-agent-sdk being the first item (an SDK with an alias),
# a protocol (mcp) and an approach (no-framework) that never count toward vendor preference, alias
# overlaps that need longest-match and word boundaries (Claude Agent SDK / Claude, Llama / LlamaIndex,
# LangGraph / LangChain), and model families with open, closed, and mixed open_weights.
