# Mergeability check: type-check and the offline test suite on every pull request and push to main.
# No secrets are used and no paid or live model is called; the suite runs against fakes and mocks.
# Tests use their own fixtures (tests/fixtures/project); experiment data (configs/, rubrics/, scenarios/)
# is not part of the tested code.
# For branch protection, require the single "CI result" check: it passes only when every matrix job passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"  # minimum supported (pyproject requires-python)
          - os: ubuntu-latest
            python: "3.15"
          - os: macos-latest  # Apple Silicon: the local-inference host platform
            python: "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q

  result:
    name: CI result
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All matrix jobs passed
        run: test "${{ needs.test.result }}" = "success"
