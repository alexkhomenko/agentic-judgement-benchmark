# Template for local provider credentials. Copy, then lock down:
#   cp secrets.example.yaml secrets.local.yaml && chmod 600 secrets.local.yaml
# secrets.local.yaml is ignored by Git. The harness refuses to load it if it is tracked, not ignored,
# or readable by anyone but you, and refuses to write any artifact, record, or frozen config that
# contains a loaded key.
anthropic:
  api_key: "<your Anthropic API key>"
openai:
  api_key: "<your OpenAI API key>"
google:
  api_key: "<your Gemini API key>"   # Gemini Developer API; keys at aistudio.google.com
mistral:
  api_key: "<your Mistral API key>"  # La Plateforme; keys at console.mistral.ai
xai:
  api_key: "<your xAI API key>"      # Grok API; keys at console.x.ai
deepseek:
  api_key: "<your DeepSeek API key>" # keys at platform.deepseek.com
typesafe:
  api_key: "<your TypeSafe API key>"   # Jev classifier; keys at console.typesafe.ai/keys
